# Describes the format for available dwarf_mini services
goto_coordinates:
  fields:
    device_id:
      required: true
      selector:
        device:
          integration: dwarf_mini
    ra_hours:
      required: true
      example: 5.588
      selector:
        number:
          min: 0
          max: 24
          step: 0.001
          mode: box
          unit_of_measurement: h
    dec_degrees:
      required: true
      example: -5.39
      selector:
        number:
          min: -90
          max: 90
          step: 0.001
          mode: box
          unit_of_measurement: "°"
    target_name:
      required: false
      example: "Custom target"
      selector:
        text:
